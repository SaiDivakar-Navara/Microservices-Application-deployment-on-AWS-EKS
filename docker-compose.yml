# Runs the whole platform locally: Postgres + 7 microservices + the React storefront.
#   docker compose up --build        then open http://localhost:8080

x-db: &db
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: verve
  DB_PASSWORD: verve_pass
  DB_SSLMODE: disable

x-peers: &peers
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-verve-internal-dev-key}
  AUTH_URL: http://auth-service:8081
  CATALOG_URL: http://catalog-service:8082
  INVENTORY_URL: http://inventory-service:8083
  ORDER_URL: http://order-service:8084
  PAYMENT_URL: http://payment-service:8085
  NOTIFICATION_URL: http://notification-service:8086

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    build: ./services/auth-service
    image: verve/auth-service:1.0
    environment:
      <<: [*db, *peers]
      DB_NAME: auth_db
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }

  catalog-service:
    build: ./services/catalog-service
    image: verve/catalog-service:1.0
    environment:
      <<: [*db, *peers]
      DB_NAME: catalog_db
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }

  inventory-service:
    build: ./services/inventory-service
    image: verve/inventory-service:1.0
    environment:
      <<: [*db, *peers]
      DB_NAME: inventory_db
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }

  order-service:
    build: ./services/order-service
    image: verve/order-service:1.0
    environment:
      <<: [*db, *peers]
      DB_NAME: order_db
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }

  payment-service:
    build: ./services/payment-service
    image: verve/payment-service:1.0
    environment:
      <<: [*db, *peers]
      DB_NAME: payment_db
    ports: ["8085:8085"]
    depends_on:
      postgres: { condition: service_healthy }

  notification-service:
    build: ./services/notification-service
    image: verve/notification-service:1.0
    environment:
      <<: [*db, *peers]
      DB_NAME: notification_db
    ports: ["8086:8086"]
    depends_on:
      postgres: { condition: service_healthy }

  analytics-service:
    build: ./services/analytics-service
    image: verve/analytics-service:1.0
    environment:
      <<: [*db, *peers]
      DB_NAME: analytics_db
    ports: ["8087:8087"]
    depends_on:
      postgres: { condition: service_healthy }

  frontend:
    build: ./frontend
    image: verve/frontend:1.0
    ports:
      - "8080:80"
    volumes:
      # Compose has no ingress, so this variant of nginx.conf also proxies /api/<service>.
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - catalog-service
      - inventory-service
      - order-service
      - payment-service
      - notification-service
      - analytics-service

volumes:
  postgres_data:
