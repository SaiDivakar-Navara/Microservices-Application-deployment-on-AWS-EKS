apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: verve
  labels:
    app: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/catalog-service:1.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: verve-config
            - secretRef:
                name: verve-secret
          env:
            - name: DB_NAME
              value: catalog_db
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: verve
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8082
      targetPort: 8082
