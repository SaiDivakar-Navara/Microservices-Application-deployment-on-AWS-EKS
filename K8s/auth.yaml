apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: verve
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/auth-service:1.0
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: verve-config
            - secretRef:
                name: verve-secret
          env:
            - name: DB_NAME
              value: auth_db
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: verve
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
