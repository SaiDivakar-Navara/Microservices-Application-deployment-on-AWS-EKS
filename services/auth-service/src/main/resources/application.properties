server.port=${PORT:8081}
spring.application.name=auth-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER:verve}
spring.datasource.password=${DB_PASSWORD:verve_pass}

# Create the two demo accounts on first start. Set to false in a real environment.
verve.seed-demo-users=${SEED_DEMO_USERS:true}
