# Used by docker-compose.yml: same as nginx.conf, plus a reverse proxy for every API service.
# Each service already serves its routes under /api/<name>, so nothing is rewritten.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/auth          { proxy_pass http://auth-service:8081; }
    location /api/catalog       { proxy_pass http://catalog-service:8082; }
    location /api/inventory     { proxy_pass http://inventory-service:8083; }
    location /api/orders        { proxy_pass http://order-service:8084; }
    location /api/payments      { proxy_pass http://payment-service:8085; }
    location /api/notifications { proxy_pass http://notification-service:8086; }
    location /api/analytics     { proxy_pass http://analytics-service:8087; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
