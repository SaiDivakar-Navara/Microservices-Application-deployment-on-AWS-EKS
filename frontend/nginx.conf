# Serves the built React app. API routing is handled outside this container:
#   Docker Compose -> nginx.compose.conf (mounted over this file)
#   Kubernetes     -> ALB Ingress path rules for /api/<service>
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
